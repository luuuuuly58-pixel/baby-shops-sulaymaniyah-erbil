<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f7f8;--card:#fff;--ink:#16212b;--dim:#63757f;--line:#e0e8ea;
      --brand:#16867a;--deep:#0f3f4f;--gold:#c9922e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1518;--card:#182126;--ink:#e8eef0;
      --dim:#93a5ae;--line:#2a363c;--brand:#3fb3a3;--deep:#cfe3e2}}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,

.nm,.tl,.note,.addr,.acts a,h1,.sub{overflow-wrap:anywhere}

header{background:var(--deep);color:#fff;padding:16px 16px 14px;display:flex;

.htxt{flex:1;min-width:0}
h1{margin:0;font-size:19px;letter-spacing:-.2px}
.sub{opacity:.75;font-size:13px;margin-top:3px}
.langs{display:flex;gap:6px;flex:none}
.langs button{background:rgba(255,255,255,.16);color:inherit;border:0;border-radius:99px;
  padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:32px}
.langs button[aria-pressed=true]{background:#fff;color:#0f3f4f}
@media(prefers-color-scheme:dark){.langs button{background:rgba(255,255,255,.1)}}
.sticky{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 12px 8px}
#q{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:11px;
   font-size:16px;background:var(--card);color:var(--ink)}
#q:focus{outline:2px solid var(--brand);outline-offset:-1px}
.tabs{display:flex;gap:7px;overflow-x:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--dim);
  border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.tab[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.opts{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px;color:var(--dim)}
.opts input{width:17px;height:17px;accent-color:var(--brand)}
main{padding:12px 12px 30px;max-width:760px;margin:0 auto}
.count{font-size:12.5px;color:var(--dim);margin:2px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;margin-bottom:11px}
.card.key{border-inline-start:4px solid var(--gold)}
.nm{font-weight:700;font-size:16px;color:var(--deep);line-height:1.3}
@media(prefers-color-scheme:dark){.nm{color:var(--ink)}}
.tl{font-size:12px;color:var(--dim);margin-top:1px}
.ty{display:inline-block;font-size:11.5px;font-weight:600;color:var(--brand);
  background:color-mix(in srgb,var(--brand) 12%,transparent);
  padding:2px 8px;border-radius:99px;margin-top:6px}
.note{font-size:13px;color:var(--dim);margin-top:7px}
.addr{font-size:13.5px;margin-top:7px;opacity:.9}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.acts a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  font-size:13.5px;font-weight:600;padding:9px 13px;border-radius:10px;
  border:1px solid var(--line);color:var(--deep);background:var(--bg);min-height:40px}
@media(prefers-color-scheme:dark){.acts a{color:var(--ink)}}
.acts a.call{background:var(--brand);border-color:var(--brand);color:#fff}
.acts a.wa{background:#25d366;border-color:#25d366;color:#0a2e17}
.acts a.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);border:0;color:#fff}
.acts a:active{transform:scale(.97)}
.nop{font-size:13px;color:var(--dim);margin-top:10px;font-style:italic}
footer{max-width:760px;margin:0 auto;padding:6px 14px 40px;font-size:12px;color:var(--dim)}
footer a{color:var(--brand)}
.empty{text-align:center;color:var(--dim);padding:40px 10px}
svg{width:15px;height:15px;flex:none}

  });
  if(d.g) a+=`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${d.g[0]},${d.g[1]}">${IC.map}${esc(t.map)}</a>`;
  if(d.ig) a+=`<a class="ig" target="_blank" rel="noopener" href="https://${esc(d.ig)}">${IC.ig}${esc(t.ig)}</a>`;
  if(d.fb) a+=`<a target="_blank" rel="noopener" href="https://${esc(d.fb)}">${IC.fb}${esc(t.fb)}</a>`;
  if(d.e) a+=`<a href="mailto:${esc(d.e)}">${IC.mail}${esc(t.mail)}</a>`;
  if(d.w) a+=`<a target="_blank" rel="noopener" href="${esc(d.w)}">${IC.web}${esc(t.web)}</a>`;
  h+= a?`<div class="acts">${a}</div>`:`<div class="nop">${esc(t.nophone)}</div>`;
  return h+'</div>';
}

function render(){
  const t=STR[lang], q=el('q').value.trim().toLowerCase(), onlyP=el('onlyPhone').checked;
  let rows=DATA.filter(d=>d.c===tab);
  if(onlyP) rows=rows.filter(d=>d.p.length);
  if(q) rows=rows.filter(d=>(d.n+' '+d.tl+' '+d.a+' '+d.ty.join(' ')+' '+d.ne+' '+d.nk)
        .toLowerCase().includes(q));
  el('count').textContent=`${rows.length} ${t.count}`;
  el('list').innerHTML=rows.length?rows.map(card).join(''):`<div class="empty">${esc(t.none)}</div>`;
}

el('bEN').onclick=()=>{lang='en';chrome();render();};
el('bKU').onclick=()=>{lang='ku';chrome();render();};
el('q').oninput=render; el('onlyPhone').onchange=render;
chrome(); render();
</script></body></html>
